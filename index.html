<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SoundBox - Nequi Monitor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            cursor: pointer;
            border: 2px solid #38bdf8;
        }
        h2 { color: #38bdf8; }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #4ade80;
        }
    </style>
</head>
<body>
    <div class="card" onclick="activarSistema()">
        <h2>🔊 SoundBox Nequi</h2>
        <p>Haz clic aquí para activar el sistema de voz.</p>
        <div class="status" id="status">Estado: En espera de activación...</div>
    </div>

    <audio id="sonidoAlerta" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        let sistemaActivo = false;
        let ultimoIdProcesado = 0;

        function activarSistema() {
            sistemaActivo = true;
            document.getElementById('status').innerText = "Estado: ¡Monitoreando pagos activamente!";
            
            const audio = document.getElementById('sonidoAlerta');
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
            }).catch(e => console.log(e));

            hablar("Sistema activado correctamente");
        }

        function hablar(texto) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const mensaje = new SpeechSynthesisUtterance(texto);
            mensaje.lang = 'es-CO';
            mensaje.rate = 1.0;
            window.speechSynthesis.speak(mensaje);
        }

        // Consultar al servidor cada 3 segundos si hay un pago nuevo
        setInterval(async () => {
            if (!sistemaActivo) return;

            try {
                const response = await fetch('https://soundbox-nequi-api.onrender.com/api/ultima-transaccion');
                const data = await response.json();

                // Si hay un pago nuevo que no se ha procesado
                if (data.id && data.id !== ultimoIdProcesado) {
                    ultimoIdProcesado = data.id;

                    // Reproducir sonido de campana
                    const audio = document.getElementById('sonidoAlerta');
                    audio.currentTime = 0;
                    audio.play().catch(err => console.log("Audio bloqueado:", err));

                    // Hablar el monto y pagador
                    hablar(`¡Recibiste un pago por ${data.monto} pesos de ${data.pagador}!`);
                }
            } catch (error) {
                console.log("Error consultando el servidor:", error);
            }
        }, 3000);
    </script>
</body>
</html>
