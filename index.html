<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SoundBox - Nequi Monitor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
        }
        h2 { color: #38bdf8; }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #4ade80;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔊 SoundBox Nequi</h2>
        <p>Haz clic en esta tarjeta para activar el audio y mantén la pestaña abierta.</p>
        <div class="status" id="status">Estado: Esperando activación de audio...</div>
    </div>

    <script>
        let audioActivado = false;

        document.querySelector('.card').addEventListener('click', () => {
            audioActivado = true;
            document.getElementById('status').innerText = "Estado: Escuchando pagos en vivo...";
            // Sonido de prueba al activar
            reproducirAlerta("100", "Prueba");
        });

        function reproducirAlerta(monto, pagador) {
            if (!audioActivado) return;

            // Alerta de campana
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);

            // Alerta de voz
            if ('speechSynthesis' in window) {
                const mensaje = new SpeechSynthesisUtterance(`¡Recibiste un pago por ${monto} pesos de ${pagador}!`);
                mensaje.lang = 'es-CO';
                window.speechSynthesis.speak(mensaje);
            }
        }

        // Conectarse al servidor en Render en tiempo real
        const eventSource = new EventSource('https://soundbox-nequi-api.onrender.com/api/events');

        eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            reproducirAlerta(data.monto, data.pagador);
        };
    </script>
</body>
</html>
